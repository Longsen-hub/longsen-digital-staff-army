html,body{height:100%}

.mq-wrap{position:relative;z-index:3;margin-top:-180px;padding-bottom:20px}
.mq-mask{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mq-track{display:flex;gap:14px;width:max-content;animation:mq 60s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq-track:hover{animation-play-state:paused}
.mcell{width:238px;flex-shrink:0;background:rgba(19,20,26,.85);border:1px solid var(--border);border-radius:16px;padding:16px;backdrop-filter:blur(8px);transition:border-color .2s,transform .2s}

.mcell .no{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.mcell .id{font-size:34px;font-weight:800;margin-top:6px;line-height:1}
.mcell .nm{font-size:15px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:8px}
.mcell .nm .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mcell .fn{font-size:11.5px;color:var(--text-50);margin-top:6px;line-height:1.6}

.foot{position:relative;z-index:3;text-align:center;color:var(--text-50);font-size:11px;letter-spacing:.12em;padding:26px 0 30px}
@media(max-width:820px){
  .hero .in{padding:90px 18px 190px}
  .mq-wrap{margin-top:-150px}
  .mcell{width:200px}
  .stats{gap:26px}

@media(prefers-reduced-motion:reduce){.mq-track{animation:none}.bg-video{display:none}}
